services:
  - type: web
    name: spark-talent-hunt
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
